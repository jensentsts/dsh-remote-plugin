<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <radialGradient id="gY3" cx="14%" cy="10%" r="55%">
      <stop offset="0" stop-color="#f3d64e" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#f3d64e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gT3" cx="88%" cy="90%" r="55%">
      <stop offset="0" stop-color="#63d3c0" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#63d3c0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots3" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1.6" fill="#ffffff" opacity="0.04"/>
    </pattern>
    <filter id="sh3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#f3d64e"/>
    </marker>
    <marker id="arrT" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#63d3c0"/>
    </marker>
  </defs>

  <rect width="1440" height="900" rx="26" fill="#121317"/>
  <rect width="1440" height="900" rx="26" fill="url(#dots3)"/>
  <rect width="1440" height="900" rx="26" fill="url(#gY3)"/>
  <rect width="1440" height="900" rx="26" fill="url(#gT3)"/>
  <rect x="0.5" y="0.5" width="1439" height="899" rx="25.5" fill="none" stroke="#2c2e37"/>

  <g transform="translate(64,46)">
    <rect x="0" y="0" width="196" height="30" rx="15" fill="#1d1e24" stroke="#34363f"/>
    <text x="16" y="20" fill="#f3d64e" font-size="14" font-family="'Cascadia Code',Consolas,ui-monospace,monospace">镜头 ② · ieee_tools</text>
  </g>
  <text x="64" y="120" fill="#f7f7fa" font-size="34" font-weight="700">远端独有的插件，本地直接点名</text>
  <text x="64" y="152" fill="#9aa0aa" font-size="18">本机 profile 从没装过 IEEE 插件；工具表里却有 ieee_search / ieee_download / ieee_extract。</text>

  <!-- left card -->
  <g filter="url(#sh3)">
    <rect x="64" y="190" width="566" height="404" rx="20" fill="#181a20" stroke="#2c2e37"/>
  </g>
  <text x="88" y="228" fill="#f7f7fa" font-size="20" font-weight="700">本机 agent 的工具面</text>
  <text x="88" y="252" fill="#8b929c" font-size="14">模型看到的是一份完整工具表</text>
  <line x1="88" y1="268" x2="606" y2="268" stroke="#2c2e37"/>

  <g font-family="'Cascadia Code',Consolas,ui-monospace,monospace" font-size="15">
    <!-- local tools -->
    <rect x="88" y="284" width="236" height="34" rx="8" fill="#21232b" stroke="#34363f"/>
    <text x="102" y="306" fill="#cfd3da">read / write</text>
    <rect x="334" y="284" width="272" height="34" rx="8" fill="#21232b" stroke="#34363f"/>
    <text x="348" y="306" fill="#cfd3da">pwsh / glob</text>

    <rect x="88" y="328" width="236" height="34" rx="8" fill="#21232b" stroke="#34363f"/>
    <text x="102" y="350" fill="#cfd3da">subagent</text>
    <rect x="334" y="328" width="272" height="34" rx="8" fill="#21232b" stroke="#34363f"/>
    <text x="348" y="350" fill="#cfd3da">todo_write</text>

    <!-- mirrored remote tools -->
    <rect x="88" y="384" width="518" height="38" rx="9" fill="#172b2a" stroke="#2f6f67"/>
    <rect x="90" y="386" width="3.5" height="34" rx="1.75" fill="#63d3c0"/>
    <text x="106" y="409" fill="#d9fff8">ieee_search</text>
    <rect x="470" y="391" width="122" height="24" rx="12" fill="#123c37" stroke="#2f6f67"/>
    <text x="531" y="408" fill="#7fe0d1" font-size="12" text-anchor="middle">来自对端 · 镜像</text>

    <rect x="88" y="430" width="518" height="38" rx="9" fill="#172b2a" stroke="#2f6f67"/>
    <rect x="90" y="432" width="3.5" height="34" rx="1.75" fill="#63d3c0"/>
    <text x="106" y="455" fill="#d9fff8">ieee_download</text>
    <rect x="470" y="437" width="122" height="24" rx="12" fill="#123c37" stroke="#2f6f67"/>
    <text x="531" y="454" fill="#7fe0d1" font-size="12" text-anchor="middle">来自对端 · 镜像</text>

    <rect x="88" y="476" width="518" height="38" rx="9" fill="#172b2a" stroke="#2f6f67"/>
    <rect x="90" y="478" width="3.5" height="34" rx="1.75" fill="#63d3c0"/>
    <text x="106" y="501" fill="#d9fff8">ieee_extract</text>
    <rect x="470" y="483" width="122" height="24" rx="12" fill="#123c37" stroke="#2f6f67"/>
    <text x="531" y="500" fill="#7fe0d1" font-size="12" text-anchor="middle">来自对端 · 镜像</text>
  </g>

  <text x="88" y="542" fill="#8b929c" font-size="14">重名时本机工具永远优先；仍想调远端版本：</text>
  <text x="88" y="566" fill="#f3d64e" font-size="14" font-family="'Cascadia Code',Consolas,ui-monospace,monospace">remote_tool_call("ieee_search", {...})</text>

  <!-- right card -->
  <g filter="url(#sh3)">
    <rect x="810" y="190" width="566" height="404" rx="20" fill="#181a20" stroke="#2c2e37"/>
  </g>
  <text x="834" y="228" fill="#f7f7fa" font-size="20" font-weight="700">远端 DSH 内核</text>
  <text x="834" y="252" fill="#8b929c" font-size="14">真正执行工具本体的地方</text>
  <line x1="834" y1="268" x2="1352" y2="268" stroke="#2c2e37"/>

  <g font-size="14" font-family="'Cascadia Code',Consolas,ui-monospace,monospace">
    <rect x="834" y="284" width="518" height="38" rx="9" fill="#1c1e25" stroke="#34363f"/>
    <text x="850" y="308" fill="#a9b0ba">agentPresets.acquireScope(preset)</text>
    <rect x="834" y="330" width="518" height="38" rx="9" fill="#1c1e25" stroke="#34363f"/>
    <text x="850" y="354" fill="#a9b0ba">ctx.tools.get(name, scope)</text>
    <rect x="834" y="376" width="518" height="46" rx="9" fill="#1c1e25" stroke="#34363f"/>
    <text x="850" y="404" fill="#d9fff8">definition.execute(args, { agent: undefined })</text>

    <!-- executing plugin -->
    <g>
      <rect x="834" y="440" width="248" height="44" rx="10" fill="#172b2a" stroke="#2f6f67"/>
      <text x="850" y="467" fill="#7fe0d1" font-size="15" font-family="'Cascadia Code',Consolas,ui-monospace,monospace">ieee_tools</text>
      <text x="964" y="467" fill="#5aa79c" font-size="12">检索 / 下载 / 提取</text>
    </g>
    <rect x="1098" y="440" width="120" height="44" rx="10" fill="#21232b" stroke="#34363f"/>
    <text x="1158" y="467" fill="#a9b0ba" font-size="13" text-anchor="middle">MCP 网关</text>
    <rect x="1232" y="440" width="120" height="44" rx="10" fill="#21232b" stroke="#34363f"/>
    <text x="1292" y="467" fill="#a9b0ba" font-size="13" text-anchor="middle">自定义插件</text>
  </g>

  <text x="834" y="518" fill="#8b929c" font-size="14">执行期间没有会话、没有模型轮次：</text>
  <g>
    <rect x="834" y="532" width="246" height="40" rx="10" fill="#1a1c22" stroke="#2c2e37"/>
    <text x="850" y="557" fill="#63d3c0" font-size="14">agent = undefined</text>
    <rect x="1090" y="532" width="262" height="40" rx="10" fill="#1a1c22" stroke="#2c2e37"/>
    <text x="1106" y="557" fill="#63d3c0" font-size="14">远端模型 token 消耗 = 0</text>
  </g>

  <!-- center connector -->
  <path d="M630 380 h172" stroke="#f3d64e" stroke-width="2.6" fill="none" marker-end="url(#arr)"/>
  <path d="M802 404 h-172" stroke="#63d3c0" stroke-width="2.6" fill="none" marker-end="url(#arrT)"/>
  <g>
    <rect x="640" y="330" width="152" height="30" rx="15" fill="#1a1c22" stroke="#2c2e37"/>
    <text x="716" y="350" fill="#f3d64e" font-size="13" text-anchor="middle" font-family="'Cascadia Code',Consolas,ui-monospace,monospace">caps.call</text>
  </g>
  <text x="716" y="326" fill="#6b727d" font-size="12" text-anchor="middle" font-family="'Cascadia Code',Consolas,ui-monospace,monospace">level 3 · retries: 0</text>

  <!-- transcript -->
  <g filter="url(#sh3)">
    <rect x="64" y="628" width="1312" height="212" rx="18" fill="#16181e" stroke="#2c2e37"/>
  </g>
  <g>
    <circle cx="92" cy="658" r="5" fill="#f3d64e"/>
    <text x="106" y="663" fill="#f3d64e" font-size="14" font-family="'Cascadia Code',Consolas,ui-monospace,monospace">你</text>
    <text x="140" y="663" fill="#e6e8ec" font-size="16">帮我查 2024 年虚拟惯性方向最近的 IEEE 论文，挑两篇下载下来。</text>
  </g>
  <g font-family="'Cascadia Code',Consolas,ui-monospace,monospace" font-size="14">
    <circle cx="92" cy="722" r="5" fill="#63d3c0"/>
    <text x="106" y="727" fill="#63d3c0" font-size="14">AI</text>
    <text x="140" y="727" fill="#cfd3da">ieee_search(query="virtual inertia", yearFrom=2024)</text>
    <text x="140" y="750" fill="#6b727d">→ 12 篇命中：标题 / 作者 / DOI / 引用数</text>
    <text x="140" y="776" fill="#cfd3da">ieee_download(arnumbers=["10987654", "10987123"])</text>
    <text x="140" y="799" fill="#6b727d">→ PDF 落在对端 E:\__papers__\ （本机从未安装该插件）</text>
  </g>
  <g>
    <circle cx="92" cy="818" r="5" fill="#b79bff"/>
    <text x="106" y="823" fill="#b79bff" font-size="14" font-family="'Cascadia Code',Consolas,ui-monospace,monospace">AI</text>
    <text x="140" y="823" fill="#cfd3da" font-size="15">两篇都收好了，要我顺便把 PDF 也取到本机吗？</text>
  </g>
</svg>
